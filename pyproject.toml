[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openend"
version = "0.2.0"
description = "A controlled pilot for sparse exploration of online bin-packing policies"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
api = ["openai>=2.21,<3", "python-dotenv>=1.0,<2"]
dev = ["pytest>=8.4,<9", "ruff>=0.11,<1"]

[project.scripts]
openend = "openend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
cache_dir = ".cache/pytest"

[tool.ruff]
line-length = 100
target-version = "py311"
